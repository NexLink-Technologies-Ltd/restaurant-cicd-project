name: Restaurant CI-CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restaurant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build container image (validation)
        run: docker build -t restaurant-cicd:test .

  publish:
    name: Publish image and update GitOps manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Update deployment image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("k8s/deployment.yaml")
          content = p.read_text()
          lines = content.splitlines()
          changed = False
          for i, line in enumerate(lines):
              if line.strip().startswith("image:") and "restaurant-cicd" in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i] = f"{indent}image: {os.environ['IMAGE']}"
                  changed = True
                  break
          if not changed:
              raise SystemExit("Could not find restaurant-cicd image line in k8s/deployment.yaml")
          p.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit updated GitOps manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: deploy image ${GITHUB_SHA} [skip ci]"
            git push
          fi
